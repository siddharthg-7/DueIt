name: dueit
description: "DueIt - Mobile Financial Collection Assistant for Small Business Owners"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Navigation & Deep Linking
  go_router: ^14.8.0

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Utility & Formatting
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1

  # Local Persistence & Offline Caching
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Firebase & Authentication
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # Local Notifications & Scheduling
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
